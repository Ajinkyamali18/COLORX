
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLORX - Color Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #191e2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #35d6a0;
      font-size: 27px;
      font-weight: bold;
    }

    .wallet {
      background: #292f40;
      padding: 10px 14px;
      border-radius: 10px;
    }

    main {
      max-width: 500px;
      margin: 25px auto;
      padding: 16px;
    }

    .round {
      background: #191e2b;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
    }

    .round h2 {
      margin-bottom: 15px;
    }

    .timer {
      color: #35d6a0;
      font-size: 42px;
      font-weight: bold;
    }

    .demo {
      color: #b8bfd0;
      margin-top: 10px;
      font-size: 13px;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .color {
      padding: 22px 5px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .red { background: #e94455; }
    .green { background: #159e69; }
    .violet { background: #824de0; }

    .history {
      background: #191e2b;
      margin-top: 22px;
      padding: 20px;
      border-radius: 15px;
    }

    .history h3 {
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      color: #8992a6;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">COLORX</div>
    <div class="wallet">Demo Wallet: ₹1,000</div>
  </header>

  <main>
    <section class="round">
      <h2>30 Second Color Game</h2>
      <div class="timer" id="timer">00:30</div>
      <p class="demo">DEMO MODE · Virtual balance only</p>
    </section>

    <section class="colors">
      <div class="color red">RED</div>
      <div class="color green">GREEN</div>
      <div class="color violet">VIOLET</div>
    </section>

    <section class="history">
      <h3>Game History</h3>
      <p id="history">No results yet</p>
    </section>
  </main>

  <footer>COLORX © 2026 · Demo Platform</footer>

  <script>
    let seconds = 30;

    setInterval(() => {
      seconds--;

      if (seconds < 0) {
        seconds = 30;
      }

      document.getElementById("timer").textContent =
        "00:" + String(seconds).padStart(2, "0");
    }, 1000);
  </script>
</body>
</html>
